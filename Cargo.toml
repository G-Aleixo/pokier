[package]
name = "pokier"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
postcard = { version = "1.1.3", features = [ "alloc" ] }
rand = "0.10.1"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = [ "derive" ] }
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = [ "full" ] }
toml = "0.9.10"
uuid = { version = "1.23.1", features = [ "v4", "serde" ] }
